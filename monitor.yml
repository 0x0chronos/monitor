name: BBRadar Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos, 24h por dia
  workflow_dispatch:           # botão "Run workflow" manual no GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # necessário para commitar state.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests --quiet

      - name: Rodar monitor
        run: python monitor.py

      - name: Salvar estado e status page
        run: |
          git config user.name  "BBRadar Bot"
          git config user.email "bbradar-bot@noreply"
          git add state.json index.html
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no estado."
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
